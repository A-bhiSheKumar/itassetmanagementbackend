# Scrape configuration for the ITAM API.
#
# The metrics endpoint is public in the same sense the health checks are — it
# carries route patterns, counts and latencies, never ids or names — but it
# should still be unreachable from the internet. Keep it on an internal network
# or deny /health/metrics at the edge; a bearer token does not help a scraper.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: itam-api
    metrics_path: /api/v1/health/metrics
    # Every replica is scraped separately: the counters are per-process, and
    # aggregating across replicas is the scraper's job, not the app's.
    static_configs:
      - targets: ['itam-api:3000']
